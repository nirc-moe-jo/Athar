<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text-main: #141619;
      --text-muted: #5e656e;
      --text-subtle: #9ea5af;
      --border: rgba(0, 0, 0, 0.07);
      --font-body: 'Readex Pro', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
    body { background: var(--bg); color: var(--text-main); padding: clamp(20px, 3.5vw, 32px); line-height: 1.6; }

    .module-container { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .header-tag { font-family: var(--font-code); font-size: 11px; color: var(--text-subtle); letter-spacing: 0.5px; }
    h2 { font-size: clamp(17px, 3vw, 20px); font-weight: 600; margin: 2px 0 12px; }

    .team-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width: 580px) { .team-cards-grid { grid-template-columns: 1fr; } }

    .member-footprint-card {
      background: #fafaf8; border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .member-footprint-card input {
      width: 100%; border: none; background: transparent; font-size: 13.5px; font-weight: 600;
      border-bottom: 1px solid var(--border); padding-bottom: 4px; outline: none;
    }
    .member-footprint-card textarea {
      width: 100%; border: none; background: transparent; outline: none; font-size: 12px;
      resize: none; min-height: 55px; line-height: 1.6; color: var(--text-main);
    }

    .closing-wisdom {
      text-align: center; margin-top: 14px; font-size: 12px; color: var(--text-subtle);
      border-top: 1px dashed var(--border); padding-top: 14px;
    }
  </style>
</head>
<body>

  <div class="module-container">
    <div>
      <span class="header-tag">أَثَـر · HORIZON 05</span>
      <h2>بصمة الصانع والأثر القيادي الفردي</h2>
    </div>

    <div class="team-cards-grid">
      <div class="member-footprint-card">
        <input type="text" placeholder="اسم العضو ودوره المباشر في المشروع...">
        <textarea placeholder="المساهمة المحددة التي أحدثت فارقاً حقيقياً وأفتخر بها في مسار هذا الابتكار..."></textarea>
      </div>

      <div class="member-footprint-card">
        <span style="font-size:11px; color:var(--text-subtle);">الدرس المهاري المستفاد:</span>
        <textarea placeholder="ما هي المهارة أو الحكمة الهندسية التي ستأخذها معك بعد هذا المشروع؟"></textarea>
      </div>
    </div>

    <div class="closing-wisdom">
      "العلم أثرٌ يُبنى باليقين، وصناعة اليوم بذرة الغد."
    </div>
  </div>

</body>
</html>
